name: jobscan

on:
  schedule:
    # 07:30 IST = 02:00 UTC, every day
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        required: true
        default: scan
        options:
          - scan
          - diagnose
          - prune
          - dry-run
      max_age:
        description: "Only roles posted within N days (scan/dry-run only)"
        type: string
        required: false
        default: "2"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          MODE: ${{ github.event.inputs.mode || 'scan' }}
          MAX_AGE: ${{ github.event.inputs.max_age || '2' }}
        run: |
          case "$MODE" in
            diagnose) python jobscan.py --diagnose ;;
            prune)    python jobscan.py --prune ;;
            dry-run)  python jobscan.py --dry-run --max-age "$MAX_AGE" ;;
            *)        python jobscan.py --max-age "$MAX_AGE" ;;
          esac

      - name: Commit state
        run: |
          git config user.name  "jobscan"
          git config user.email "jobscan@users.noreply.github.com"
          git add seen.json pipeline.csv fetch_errors.log dead_rows.txt companies.csv || true
          git diff --staged --quiet || git commit -m "$MODE $(date -u +%Y-%m-%d)"
          git push
        env:
          MODE: ${{ github.event.inputs.mode || 'scan' }}