name: jobscan

on:
  schedule:
    # Every 2 hours. A role posted at 10am IST reaches you by noon at worst.
    # Repo is private, so Actions minutes are capped at 2000/month on the free
    # tier; at ~3 billed minutes a run this uses roughly half of that. Hourly
    # would overrun it - make the repo public for unlimited minutes first.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        required: true
        default: scan
        options:
          - scan
          - backlog
          - discover
          - diagnose
          - prune
          - dry-run
          - applied
      max_age:
        description: "Only roles posted within N days (scan/dry-run only)"
        type: string
        required: false
        default: "2"
      url:
        description: "applied mode: the posting URL you applied to"
        type: string
        required: false
      status:
        description: "applied mode: where it stands"
        type: choice
        required: false
        default: applied
        options:
          - applied
          - referred
          - interview
          - rejected
          - offer
          - withdrawn

permissions:
  contents: write

# One run at a time. Two overlapping runs (a manual dispatch landing on the
# cron) each rewrite seen.json from the same base, and the loser's push fails.
concurrency:
  group: jobscan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'scan' }}
          MAX_AGE: ${{ github.event.inputs.max_age || '2' }}
          URL: ${{ github.event.inputs.url }}
          STATUS: ${{ github.event.inputs.status || 'applied' }}
        run: |
          case "$MODE" in
            backlog)  python jobscan.py --repair-seen && python jobscan.py --backlog ;;
            discover) python discover.py ;;
            diagnose) python jobscan.py --diagnose ;;
            prune)    python jobscan.py --prune ;;
            dry-run)  python jobscan.py --dry-run --max-age "$MAX_AGE" ;;
            applied)  python jobscan.py --applied "$URL" --status "$STATUS" ;;
            *)        python jobscan.py --max-age "$MAX_AGE" ;;
          esac

      - name: Commit state
        run: |
          git config user.name  "jobscan"
          git config user.email "jobscan@users.noreply.github.com"
          # git add fails atomically: one missing pathspec stages nothing at
          # all, and `|| true` hides that. discovered_review.csv only exists
          # after a discover run, which silently cost a whole backlog's state.
          git add -A
          git diff --staged --quiet || git commit -m "$MODE $(date -u +%Y-%m-%d)"
          # Anything you pushed while this ran (a companies.csv or applied.csv
          # edit) would reject a bare push and lose this run's seen.json.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
        env:
          MODE: ${{ github.event.inputs.mode || 'scan' }}